<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小候鸟 · 管理员后台</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="mock.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background-color: #f1f5f9; font-size: 15px; }
        .admin-banner-gradient { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); }
        .hero-banner-gradient { background: linear-gradient(135deg, #e0f2fe 0%, #fff7ed 50%, #fdf2f8 100%); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .animate-fadeIn { animation: fadeIn 0.3s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .upload-zone { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 24px; text-align: center; cursor: pointer; transition: all .2s; }
        .upload-zone:hover, .upload-zone.drag-over { border-color: #3b82f6; background: #eff6ff; }
        .upload-zone.has-images { border-style: solid; border-color: #e2e8f0; padding: 12px; }
        .img-preview { position: relative; display: inline-block; }
        .img-preview .remove-btn { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; background: #ef4444; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; }
    </style>
</head>
<body class="text-gray-700 antialiased">
<div id="app" class="min-h-screen flex flex-col">

    <header class="admin-banner-gradient text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" @click="currentTab='results'">
                <div class="bg-blue-600 w-8 h-8 rounded-lg flex items-center justify-center"><i class="fa-solid fa-dove text-sm"></i></div>
                <h1 class="text-base font-bold tracking-tight">小候鸟 · 管理员后台</h1>
            </div>
            <nav v-if="token" class="hidden md:flex items-center space-x-1 text-sm font-medium">
                <button @click="switchPublicTab('results')" :class="currentTab==='results'?'bg-white/15 rounded-lg':''" class="px-3 py-1.5 transition-all">活动成果中心</button>
                <button @click="switchPublicTab('stories')" :class="currentTab==='stories'?'bg-white/15 rounded-lg':''" class="px-3 py-1.5 transition-all">青春志愿故事中心</button>
                <button @click="switchPublicTab('project')" :class="currentTab==='project'?'bg-white/15 rounded-lg':''" class="px-3 py-1.5 transition-all">百千万工程专区</button>
                <span class="text-white/20 mx-1">|</span>
                <button @click="switchPublicTab('admin')" :class="currentTab==='admin'?'bg-blue-600 rounded-lg':''" class="px-3 py-1.5 transition-all"><i class="fa-solid fa-sliders mr-1"></i>管理面板</button>
            </nav>
            <button v-if="token" @click="logout" class="bg-red-600 hover:bg-red-500 text-sm font-bold px-3 py-1.5 rounded-lg transition-all"><i class="fa-solid fa-right-from-bracket mr-1"></i>退出登录</button>
        </div>
    </header>

    <main class="flex-grow pb-12">

        <!-- 登录 -->
        <div v-if="!token" class="flex items-center justify-center py-24 px-4">
            <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-8 w-full max-w-sm animate-fadeIn">
                <div class="text-center mb-6">
                    <div class="bg-blue-600 text-white w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-lock text-xl"></i></div>
                    <h2 class="text-xl font-black text-gray-900">管理员登录</h2>
                    <p class="text-sm text-gray-400 mt-1">请使用管理员账号登录后台</p>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="text-sm font-bold text-gray-600 mb-1 block">用户名</label>
                        <input v-model="loginForm.username" placeholder="请输入用户名" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" @keyup.enter="login">
                    </div>
                    <div>
                        <label class="text-sm font-bold text-gray-600 mb-1 block">密码</label>
                        <input v-model="loginForm.password" type="password" placeholder="请输入密码" class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" @keyup.enter="login">
                    </div>
                    <button @click="login" :disabled="loading" class="w-full bg-blue-600 hover:bg-blue-500 disabled:bg-blue-300 text-white py-2.5 rounded-lg font-bold text-sm transition-all mt-2">
                        <span v-if="loading"><i class="fa-solid fa-spinner animate-spin mr-1"></i>登录中...</span>
                        <span v-else>登 录</span>
                    </button>
                    <p v-if="loginErr" class="text-red-500 text-sm text-center mt-2 bg-red-50 py-2 rounded-lg">{{loginErr}}</p>
                </div>
            </div>
        </div>

        <template v-else>
            <!-- 活动成果中心 -->
            <div v-if="currentTab === 'results'" class="max-w-7xl mx-auto px-6 pt-6 space-y-6 animate-fadeIn">
                <div class="hero-banner-gradient rounded-2xl p-8 border border-white/60 shadow-sm flex flex-col lg:flex-row items-center justify-between gap-6">
                    <div class="space-y-3 max-w-xl">
                        <h2 class="text-3xl font-extrabold text-blue-900 tracking-tight">活动成果展示中心</h2>
                        <p class="text-blue-700/80 text-base font-medium">记录每一次陪伴与成长，全景呈现属于"小候鸟"的精彩暑期生活。</p>
                    </div>
                    <div class="bg-white/90 backdrop-blur p-4 rounded-xl shadow-sm border border-gray-100 min-w-[320px] space-y-3">
                        <div class="flex justify-between items-center text-xs text-gray-400 border-b border-gray-100 pb-1.5">
                            <span class="font-bold text-gray-700"><i class="fa-solid fa-chart-pie text-blue-500 mr-1"></i>平台数据总览</span>
                        </div>
                        <div class="grid grid-cols-3 gap-2 text-center">
                            <div class="p-2 bg-blue-50/60 rounded-lg"><p class="text-xs text-gray-400">活动总数</p><p class="text-xl font-black text-blue-600">{{overview.totalActivities}} <span class="text-xs text-gray-400">场</span></p></div>
                            <div class="p-2 bg-pink-50/60 rounded-lg"><p class="text-xs text-gray-400">服务人次</p><p class="text-xl font-black text-pink-600">{{overview.totalParticipants}} <span class="text-xs text-gray-400">人</span></p></div>
                            <div class="p-2 bg-orange-50/60 rounded-lg"><p class="text-xs text-gray-400">志愿者</p><p class="text-xl font-black text-orange-600">{{overview.totalVolunteers}} <span class="text-xs text-gray-400">人</span></p></div>
                        </div>
                    </div>
                </div>

                <div class="flex flex-wrap gap-2 border-b border-gray-200 pb-3">
                    <button v-for="cat in pubCategories" :key="cat" @click="activeTag=cat; pubPage=1; loadActivities()" :class="activeTag===cat ? 'bg-blue-600 text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'" class="px-4 py-1.5 rounded-full text-sm font-semibold transition-all">{{cat}}</button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div v-for="t in topics" :key="t.id" :class="'bg-gradient-to-br from-' + t.coverColor + '-500 to-' + t.coverColor + '-600 p-5 rounded-xl text-white shadow-sm hover:scale-[1.01] transition-all'">
                        <span class="bg-white/20 text-xs px-2 py-0.5 rounded font-bold uppercase">{{t.icon || '专题'}}</span>
                        <h3 class="font-bold text-base mt-2">{{t.title}}</h3>
                        <p class="text-sm text-white/80 mt-1 mb-4">{{t.description}}</p>
                        <button class="text-sm font-bold bg-white text-blue-600 px-3 py-1.5 rounded-lg shadow-sm">进入专题 <i class="fa-solid fa-angle-right ml-0.5"></i></button>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
                    <div class="lg:col-span-2 space-y-4">
                        <div v-if="activities.length===0" class="text-center py-12 text-gray-400"><i class="fa-solid fa-inbox text-3xl mb-2 block"></i>暂无活动数据</div>
                        <div v-for="a in activities" :key="a.id" class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm flex flex-col sm:flex-row gap-4 hover:shadow-md transition-all">
                            <div class="sm:w-44 bg-slate-100 rounded-lg flex flex-col items-center justify-center border border-gray-200/60 shrink-0 text-slate-400 text-sm py-8">
                                <img v-if="a.coverUrl" :src="a.coverUrl" class="w-full h-full object-cover rounded-lg" />
                                <template v-else><i class="fa-regular fa-image text-2xl mb-1 text-slate-300"></i>活动实拍图</template>
                            </div>
                            <div class="flex-grow flex flex-col justify-between space-y-2">
                                <div>
                                    <div class="flex items-center space-x-2">
                                        <span class="bg-blue-50 text-blue-600 font-bold text-xs px-2 py-0.5 rounded">{{a.category}}</span>
                                        <span class="text-gray-400 text-sm"><i class="fa-regular fa-calendar-check mr-1"></i>{{a.activityDate || a.createTime}}</span>
                                    </div>
                                    <h4 class="font-bold text-gray-900 text-base mt-1 hover:text-blue-600 cursor-pointer">{{a.title}}</h4>
                                    <p class="text-gray-500 text-sm leading-relaxed mt-1 line-clamp-2">{{a.summary}}</p>
                                </div>
                                <div class="flex flex-wrap items-center justify-between text-sm text-gray-400 border-t border-gray-50 pt-2">
                                    <span class="font-medium text-gray-500" v-if="a.communityName"><i class="fa-solid fa-map-location-dot text-blue-500 mr-1"></i>{{a.communityName}}</span>
                                    <span v-if="a.participantCount">参与：{{a.participantCount}}人</span>
                                    <span class="text-blue-600 font-bold cursor-pointer hover:underline" @click="viewDetail(a)">查看详情 <i class="fa-solid fa-angle-right"></i></span>
                                </div>
                            </div>
                        </div>
                        <div class="flex justify-center gap-2 pt-4" v-if="pubTotalPages>1">
                            <button v-for="p in pubTotalPages" :key="p" @click="pubPage=p;loadActivities()" :class="pubPage===p ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 border'" class="px-3 py-1 rounded text-sm font-semibold">{{p}}</button>
                        </div>
                    </div>
                    <div class="space-y-4">
                        <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                            <h4 class="text-sm font-bold text-gray-900 border-b border-gray-100 pb-2 mb-2"><i class="fa-solid fa-bullhorn text-blue-500 mr-1"></i> 最新动态</h4>
                            <div class="space-y-2.5 text-sm">
                                <div v-for="r in recentActivities" :key="r.id" class="flex justify-between text-gray-600 hover:text-blue-600 cursor-pointer" @click="viewDetail(r)">
                                    <span class="truncate">· {{r.title}}</span><span class="text-gray-400 ml-2">{{r.activityDate}}</span>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                            <h4 class="text-sm font-bold text-gray-900 border-b border-gray-100 pb-2 mb-2.5"><i class="fa-solid fa-tags text-orange-400 mr-1"></i> 标签云</h4>
                            <div class="flex flex-wrap gap-1.5">
                                <span v-for="tag in allTags" :key="tag" class="bg-slate-50 text-slate-600 hover:bg-blue-50 hover:text-blue-600 border border-slate-200/60 text-xs px-2 py-0.5 rounded cursor-pointer">{{tag}}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 青春志愿故事中心 -->
            <div v-if="currentTab === 'stories'" class="max-w-7xl mx-auto px-6 pt-6 space-y-6 animate-fadeIn">
                <div class="hero-banner-gradient rounded-2xl p-8 border border-white/60 shadow-sm"><h2 class="text-3xl font-extrabold text-orange-900">青春志愿故事中心</h2><p class="text-orange-800/80 text-base mt-2">用青春陪伴成长，记录每一份扎根石排基层的温暖与奔赴。</p></div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div v-for="v in volunteers" :key="v.id" class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
                        <div class="bg-slate-800 h-44 flex items-center justify-center relative text-slate-400 text-sm">
                            <span class="absolute top-3 left-3 bg-black/40 text-white px-2 py-0.5 rounded text-xs">{{v.type==='TEAM'?'团队':'个人'}}</span>
                            <img v-if="v.coverUrl" :src="v.coverUrl" class="w-full h-full object-cover" />
                            <template v-else><i class="fa-solid fa-camera-retro text-2xl mr-2 text-slate-600"></i>{{v.name}}现场照</template>
                        </div>
                        <div class="p-4 space-y-2">
                            <div class="flex justify-between text-sm text-gray-400"><span>{{v.school || v.name}}</span><span v-if="v.serviceHours">服务工时：{{v.serviceHours}} 小时</span></div>
                            <h4 class="font-bold text-gray-900 text-base">"{{v.storyTitle || v.name}}"</h4>
                            <p class="text-gray-500 text-sm leading-relaxed">{{v.description}}</p>
                            <div class="text-right pt-1"><span class="text-blue-600 text-sm font-semibold cursor-pointer" @click="viewVolunteer(v)">阅读全文 ></span></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 百千万工程专区 -->
            <div v-if="currentTab === 'project'" class="max-w-7xl mx-auto px-6 pt-6 space-y-6 animate-fadeIn">
                <div class="border-b border-gray-200 pb-4"><h2 class="text-2xl font-black text-gray-900">"百千万工程"基层服务专区</h2><p class="text-gray-500 text-sm mt-0.5">对接"广东青年大学生百千万工程突击队行动"</p></div>
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm"><p class="text-sm text-gray-400">联动高校团队</p><h3 class="text-2xl font-black text-slate-800">{{volunteers.length}} <span class="text-sm text-gray-400">支</span></h3></div>
                    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm"><p class="text-sm text-gray-400">开展活动</p><h3 class="text-2xl font-black text-slate-800">{{overview.totalActivities}} <span class="text-sm text-gray-400">场</span></h3></div>
                    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm"><p class="text-sm text-gray-400">社区覆盖</p><h3 class="text-2xl font-black text-slate-800">{{communities.length}} <span class="text-sm text-gray-400">个</span></h3></div>
                    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm"><p class="text-sm text-gray-400">服务人次</p><h3 class="text-2xl font-black text-blue-600">{{overview.totalParticipants}} <span class="text-sm text-gray-400">人</span></h3></div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                        <div class="text-sm font-bold text-gray-800 border-b pb-2"><i class="fa-solid fa-earth-asia text-emerald-500 mr-1"></i> 社区覆盖分布</div>
                        <div class="grid grid-cols-2 gap-2 mt-3 text-sm">
                            <div v-for="c in communities" :key="c.id" class="p-2 bg-slate-50 rounded-lg flex justify-between"><span class="font-bold text-gray-700">{{c.name}}</span><span class="text-gray-400">{{c.description}}</span></div>
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                        <div class="text-sm font-bold text-gray-800 border-b pb-2"><i class="fa-solid fa-newspaper text-blue-500 mr-1"></i> 媒体报道</div>
                        <div class="space-y-2.5 text-sm mt-2">
                            <div v-for="m in medias" :key="m.id" class="p-2.5 bg-gray-50 rounded-lg border hover:bg-gray-100 cursor-pointer">
                                <span class="bg-blue-100 text-blue-700 text-[11px] px-1.5 py-0.5 rounded font-bold">{{m.source}}</span>
                                <p class="font-bold text-gray-800 mt-1 truncate">{{m.title}}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 管理面板 -->
            <div v-if="currentTab === 'admin'" class="max-w-7xl mx-auto px-6 pt-6 space-y-5 animate-fadeIn">
                <div class="flex flex-wrap items-center gap-2">
                    <button v-for="opt in adminOptions" :key="opt.key" @click="switchPanel(opt.key)" :class="adminAction===opt.key ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'" class="px-4 py-2 rounded-lg text-sm font-bold transition-all">
                        <i :class="opt.icon" class="mr-1.5"></i>{{opt.label}}
                    </button>
                </div>

                <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm"><p class="text-sm text-gray-400">活动总数</p><p class="text-xl font-black text-blue-600">{{overview.totalActivities}}</p></div>
                    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm"><p class="text-sm text-gray-400">服务人次</p><p class="text-xl font-black text-pink-600">{{overview.totalParticipants}}</p></div>
                    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm"><p class="text-sm text-gray-400">志愿者</p><p class="text-xl font-black text-orange-600">{{overview.totalVolunteers}}</p></div>
                    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm"><p class="text-sm text-gray-400">社区覆盖</p><p class="text-xl font-black text-emerald-600">{{communities.length}}</p></div>
                </div>

                <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
                    <div class="flex justify-between items-center px-5 py-3 border-b border-gray-50 bg-slate-50/50">
                        <h4 class="text-base font-bold text-gray-800">{{currentLabel}}列表</h4>
                        <div class="flex items-center gap-2">
                            <button v-if="adminAction!=='media'" @click="openEdit(null)" class="bg-blue-600 text-white text-sm px-3 py-1.5 rounded-lg hover:bg-blue-500 transition-all"><i class="fa-solid fa-plus mr-1"></i>新增</button>
                            <button v-if="adminAction==='activity'" @click="openEdit(null,'volunteer')" class="bg-emerald-600 text-white text-sm px-3 py-1.5 rounded-lg hover:bg-emerald-500 transition-all"><i class="fa-solid fa-plus mr-1"></i>新增志愿者</button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-gray-500">
                            <thead class="bg-slate-50 text-gray-700 border-b">
                                <tr>
                                    <th class="py-2.5 px-4 font-semibold">标题/名称</th>
                                    <th class="py-2.5 px-4 font-semibold">分类</th>
                                    <th class="py-2.5 px-4 font-semibold">状态</th>
                                    <th class="py-2.5 px-4 font-semibold">创建时间</th>
                                    <th class="py-2.5 px-4 font-semibold">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="item in adminList" :key="item.id" class="border-b border-gray-50 hover:bg-slate-50/50 transition-all">
                                    <td class="py-2.5 px-4 font-bold text-gray-800 max-w-[200px] truncate">{{item.title || item.name}}</td>
                                    <td class="py-2.5 px-4"><span class="bg-blue-50 text-blue-600 text-xs px-2 py-0.5 rounded font-semibold">{{item.category || item.type || item.source || '-'}}</span></td>
                                    <td class="py-2.5 px-4"><span :class="item.isPublished===1?'bg-emerald-50 text-emerald-700':'bg-amber-50 text-amber-700'" class="text-xs px-2 py-0.5 rounded font-semibold">{{item.isPublished===1?'已发布':'待发布'}}</span></td>
                                    <td class="py-2.5 px-4 text-gray-400">{{item.createTime || '-'}}</td>
                                    <td class="py-2.5 px-4">
                                        <div class="flex items-center gap-1">
                                            <button @click="togglePublish(item)" :class="item.isPublished===1?'text-amber-500 hover:text-amber-600':'text-emerald-500 hover:text-emerald-600'" class="text-sm font-semibold hover:underline">{{item.isPublished===1?'下架':'发布'}}</button>
                                            <span class="text-gray-300">|</span>
                                            <button @click="openEdit(item)" class="text-blue-500 hover:text-blue-600 text-sm font-semibold hover:underline">编辑</button>
                                            <span class="text-gray-300">|</span>
                                            <button @click="deleteItem(item)" class="text-red-400 hover:text-red-500 text-sm font-semibold hover:underline">删除</button>
                                        </div>
                                    </td>
                                </tr>
                                <tr v-if="adminList.length===0"><td colspan="5" class="py-12 text-center text-gray-400"><i class="fa-solid fa-inbox text-2xl mb-2 block"></i>暂无数据</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="flex justify-center gap-2 px-5 py-3 border-t border-gray-50 bg-slate-50/30" v-if="adminTotalPages>1">
                        <button v-for="p in adminTotalPages" :key="p" @click="adminPage=p;loadAdminData()" :class="adminPage===p ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'" class="px-3 py-1 rounded text-sm font-semibold transition-all">{{p}}</button>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- 编辑弹窗 -->
    <div v-if="showEditModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" @click.self="showEditModal=false">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 space-y-3 animate-fadeIn max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-base font-black text-gray-900">{{editingItem?'编辑':'新增'}}{{editTypeLabel}}</h3>
                <button @click="showEditModal=false" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
            </div>

            <template v-if="editType==='activity'">
                <div class="space-y-3">
                    <div>
                        <label class="text-sm font-bold text-gray-500 block mb-1">标题 <span class="text-red-400">*</span></label>
                        <input v-model="editForm.title" placeholder="请输入活动标题" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label class="text-sm font-bold text-gray-500 block mb-1">分类</label>
                            <select v-model="editForm.category" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option v-for="c in adminCategories" :key="c" :value="c">{{c}}</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-sm font-bold text-gray-500 block mb-1">活动日期</label>
                            <input v-model="editForm.activityDate" type="date" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                    <div>
                        <label class="text-sm font-bold text-gray-500 block mb-1">简介</label>
                        <input v-model="editForm.summary" placeholder="请输入活动简介" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="grid grid-cols-2 gap-2.5">
                        <div><label class="text-sm font-bold text-gray-500 block mb-1">所属社区</label><input v-model="editForm.communityName" placeholder="社区名称" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                        <div><label class="text-sm font-bold text-gray-500 block mb-1">活动地点</label><input v-model="editForm.location" placeholder="地点" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-2.5">
                        <div><label class="text-sm font-bold text-gray-500 block mb-1">参与人数</label><input v-model.number="editForm.participantCount" type="number" placeholder="0" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                        <div><label class="text-sm font-bold text-gray-500 block mb-1">志愿者人数</label><input v-model.number="editForm.volunteerCount" type="number" placeholder="0" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                    </div>

                    <!-- 图片上传区 -->
                    <div>
                        <label class="text-sm font-bold text-gray-500 block mb-1">活动图片 <span class="text-gray-400 font-normal">（拖拽或点击上传，支持多图）</span></label>
                        <div class="upload-zone" :class="{'has-images': uploadedImages.length>0, 'drag-over': dragOver}" @click="$refs.fileInput.click()" @dragover.prevent="dragOver=true" @dragleave.prevent="dragOver=false" @drop.prevent="handleDrop">
                            <input ref="fileInput" type="file" accept="image/*" multiple class="hidden" @change="handleFileSelect">
                            <div v-if="uploadedImages.length===0" class="py-4">
                                <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-300 mb-2 block"></i>
                                <p class="text-sm text-slate-500 font-medium">拖拽图片到这里，或点击选择文件</p>
                                <p class="text-xs text-slate-400 mt-1">支持 JPG / PNG / WebP，单张不超过 20MB</p>
                            </div>
                            <div v-else class="flex flex-wrap gap-2">
                                <div v-for="(img, idx) in uploadedImages" :key="idx" class="img-preview w-20 h-20 rounded-lg overflow-hidden bg-slate-100 border border-gray-200">
                                    <img :src="img" class="w-full h-full object-cover">
                                    <span class="remove-btn" @click.stop="removeUploadedImage(idx)">&times;</span>
                                </div>
                                <div class="w-20 h-20 rounded-lg border-2 border-dashed border-gray-300 flex items-center justify-center cursor-pointer hover:border-blue-400 text-gray-400 hover:text-blue-400 transition-all" @click.stop="$refs.fileInput.click()">
                                    <i class="fa-solid fa-plus text-lg"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div v-if="uploading" class="flex items-center gap-2 text-blue-600 text-sm"><i class="fa-solid fa-spinner animate-spin"></i> 上传中...</div>

                    <div>
                        <label class="text-sm font-bold text-gray-500 block mb-1">详细内容</label>
                        <textarea v-model="editForm.content" placeholder="请输入活动的详细内容描述" rows="5" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                </div>
            </template>

            <template v-if="editType==='volunteer'">
                <div class="space-y-3">
                    <div><label class="text-sm font-bold text-gray-500 block mb-1">姓名/团队名称 <span class="text-red-400">*</span></label><input v-model="editForm.name" placeholder="请输入姓名或团队名称" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                    <div class="grid grid-cols-2 gap-2.5">
                        <div><label class="text-sm font-bold text-gray-500 block mb-1">类型</label><select v-model="editForm.type" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"><option value="PERSONAL">个人</option><option value="TEAM">团队</option></select></div>
                        <div><label class="text-sm font-bold text-gray-500 block mb-1">学校/单位</label><input v-model="editForm.school" placeholder="学校或单位名称" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                    </div>
                    <div><label class="text-sm font-bold text-gray-500 block mb-1">故事标题</label><input v-model="editForm.storyTitle" placeholder="请输入故事标题" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                    <div><label class="text-sm font-bold text-gray-500 block mb-1">描述</label><textarea v-model="editForm.description" placeholder="请输入描述" rows="3" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea></div>
                    <div class="grid grid-cols-2 gap-2.5">
                        <div><label class="text-sm font-bold text-gray-500 block mb-1">服务工时</label><input v-model.number="editForm.serviceHours" type="number" placeholder="0" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                        <div><label class="text-sm font-bold text-gray-500 block mb-1">成员人数</label><input v-model.number="editForm.memberCount" type="number" placeholder="0" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                    </div>
                    <!-- 志愿者图片上传 -->
                    <div>
                        <label class="text-sm font-bold text-gray-500 block mb-1">封面图片 <span class="text-gray-400 font-normal">（拖拽或点击上传）</span></label>
                        <div class="upload-zone" :class="{'has-images': uploadedImages.length>0, 'drag-over': dragOver2}" @click="$refs.fileInput2.click()" @dragover.prevent="dragOver2=true" @dragleave.prevent="dragOver2=false" @drop.prevent="handleDropVolunteer">
                            <input ref="fileInput2" type="file" accept="image/*" class="hidden" @change="handleVolunteerFileSelect">
                            <div v-if="uploadedImages.length===0" class="py-4">
                                <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-300 mb-2 block"></i>
                                <p class="text-sm text-slate-500 font-medium">拖拽图片到这里，或点击选择</p>
                            </div>
                            <div v-else class="flex flex-wrap gap-2">
                                <div v-for="(img, idx) in uploadedImages" :key="idx" class="img-preview w-20 h-20 rounded-lg overflow-hidden bg-slate-100 border border-gray-200">
                                    <img :src="img" class="w-full h-full object-cover">
                                    <span class="remove-btn" @click.stop="removeUploadedImage(idx)">&times;</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div v-if="uploading" class="flex items-center gap-2 text-blue-600 text-sm"><i class="fa-solid fa-spinner animate-spin"></i> 上传中...</div>
                </div>
            </template>

            <template v-if="editType==='media'">
                <div class="space-y-3">
                    <div><label class="text-sm font-bold text-gray-500 block mb-1">标题 <span class="text-red-400">*</span></label><input v-model="editForm.title" placeholder="请输入媒体标题" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                    <div><label class="text-sm font-bold text-gray-500 block mb-1">来源</label><input v-model="editForm.source" placeholder="媒体来源" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                    <div>
                        <label class="text-sm font-bold text-gray-500 block mb-1">媒体图片 <span class="text-gray-400 font-normal">（拖拽或点击上传）</span></label>
                        <div class="upload-zone" :class="{'has-images': uploadedImages.length>0, 'drag-over': dragOver2}" @click="$refs.fileInput2.click()" @dragover.prevent="dragOver2=true" @dragleave.prevent="dragOver2=false" @drop.prevent="handleDropMedia">
                            <input ref="fileInput2" type="file" accept="image/*" class="hidden" @change="handleMediaFileSelect">
                            <div v-if="uploadedImages.length===0" class="py-4">
                                <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-300 mb-2 block"></i>
                                <p class="text-sm text-slate-500 font-medium">拖拽图片到这里，或点击选择</p>
                            </div>
                            <div v-else class="flex flex-wrap gap-2">
                                <div v-for="(img, idx) in uploadedImages" :key="idx" class="img-preview w-20 h-20 rounded-lg overflow-hidden bg-slate-100 border border-gray-200">
                                    <img :src="img" class="w-full h-full object-cover">
                                    <span class="remove-btn" @click.stop="removeUploadedImage(idx)">&times;</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div v-if="uploading" class="flex items-center gap-2 text-blue-600 text-sm"><i class="fa-solid fa-spinner animate-spin"></i> 上传中...</div>
                    <div><label class="text-sm font-bold text-gray-500 block mb-1">内容</label><textarea v-model="editForm.content" placeholder="请输入内容" rows="3" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea></div>
                </div>
            </template>

            <div class="flex justify-end gap-2 pt-3 border-t">
                <button @click="showEditModal=false" class="bg-slate-100 hover:bg-slate-200 text-gray-600 px-4 py-2.5 rounded-lg text-sm font-semibold transition-all">取消</button>
                <button @click="saveItem" :disabled="uploading" class="bg-blue-600 hover:bg-blue-500 disabled:bg-blue-300 text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition-all">保存</button>
            </div>
        </div>
    </div>

</div>

<script>
const API = '';

const { createApp, ref, onMounted, reactive, computed, nextTick } = Vue;

createApp({
    setup() {
        const currentTab = ref('results');
        const token = ref(localStorage.getItem('admin_token') || '');
        const loginErr = ref('');
        const loading = ref(false);

        const loginForm = reactive({ username: 'admin', password: 'admin123' });

        const pubCategories = ['全部', '课程活动', '社区活动', '研学活动', '成果总结'];
        const adminCategories = ['课程活动', '社区活动', '研学活动', '成果总结'];
        const activeTag = ref('全部');

        const activities = ref([]); const volunteers = ref([]); const medias = ref([]);
        const communities = ref([]); const topics = ref([]); const recentActivities = ref([]);
        const overview = reactive({ totalActivities: 0, totalParticipants: 0, totalVolunteers: 0 });
        const allTags = ref(['暑期托育','非遗传承','安全演练','心理辅导','科普研学','高校协同','传统文化','亲子互动']);
        const pubPage = ref(1); const pubTotalPages = ref(1);

        const adminAction = ref('activity');
        const adminOptions = [
            { key: 'activity', label: '活动管理', icon: 'fa-solid fa-calendar-check' },
            { key: 'volunteer', label: '志愿者管理', icon: 'fa-solid fa-user-group' },
            { key: 'media', label: '媒体素材', icon: 'fa-solid fa-newspaper' }
        ];
        const currentLabel = computed(() => { const opt = adminOptions.find(o => o.key === adminAction.value); return opt ? opt.label : ''; });

        const adminList = ref([]); const adminPage = ref(1); const adminTotalPages = ref(1);

        const showEditModal = ref(false); const editingItem = ref(null); const editType = ref('activity');
        const editTypeLabel = computed(() => {
            if (editType.value === 'activity') return '活动';
            if (editType.value === 'volunteer') return '志愿者';
            return '媒体';
        });

        const editForm = reactive({
            title: '', summary: '', category: '课程活动', communityName: '',
            location: '', activityDate: '', participantCount: 0, volunteerCount: 0, content: '', coverUrl: '',
            name: '', type: 'PERSONAL', school: '', memberCount: 0, storyTitle: '', description: '', serviceHours: 0,
            source: ''
        });

        const uploadedImages = ref([]);
        const uploading = ref(false);
        const dragOver = ref(false);
        const dragOver2 = ref(false);

        if (token.value) loadAll();

        async function fetchApi(url, opts = {}) {
            const headers = {};
            if (token.value) headers['Authorization'] = 'Bearer ' + token.value;
            if (!(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
            opts.headers = { ...headers, ...opts.headers };
            const res = await fetch(API + url, opts);
            const data = await res.json();
            if (data.code !== 200) throw new Error(data.msg);
            return data.data;
        }

        async function login() {
            loginErr.value = ''; loading.value = true;
            try {
                const data = await fetchApi('/api/admin/auth/login', { method: 'POST', body: JSON.stringify(loginForm) });
                token.value = data.token; localStorage.setItem('admin_token', data.token); loadAll();
            } catch(e) { loginErr.value = e.message; } finally { loading.value = false; }
        }

        function logout() { token.value = ''; localStorage.removeItem('admin_token'); loginErr.value = ''; currentTab.value = 'results'; }

        function loadAll() { loadStats(); loadCommunities(); loadTopics(); loadActivities(); loadRecent(); loadVolunteers(); loadMedias(); loadAdminData(); }

        async function loadStats() { try { const data = await fetchApi('/api/public/activity/statistics'); overview.totalActivities = data.totalActivities; overview.totalParticipants = data.totalParticipants; overview.totalVolunteers = data.totalVolunteers; } catch(e) {} }
        async function loadActivities() { try { const cat = activeTag.value === '全部' ? '' : '&category=' + encodeURIComponent(activeTag.value); const data = await fetchApi('/api/public/activity?page=' + pubPage.value + '&size=10' + cat); activities.value = data.records; pubTotalPages.value = Math.ceil(data.total / data.size); } catch(e) {} }
        async function loadRecent() { try { const data = await fetchApi('/api/public/activity?page=1&size=5'); recentActivities.value = data.records; } catch(e) {} }
        async function loadVolunteers() { try { const data = await fetchApi('/api/public/volunteer?page=1&size=20'); volunteers.value = data.records; } catch(e) {} }
        async function loadCommunities() { try { communities.value = await fetchApi('/api/public/community'); } catch(e) {} }
        async function loadTopics() { try { topics.value = await fetchApi('/api/public/topic'); } catch(e) {} }
        async function loadMedias() { try { const data = await fetchApi('/api/admin/media?page=1&size=20'); medias.value = data.records; } catch(e) {} }

        function switchPublicTab(tab) { currentTab.value = tab; if (tab === 'results') loadActivities(); if (tab === 'stories') loadVolunteers(); if (tab === 'project') { loadCommunities(); loadVolunteers(); loadMedias(); } }

        async function loadAdminData() { try { let prefix; if (adminAction.value === 'activity') prefix = '/api/admin/activity'; else if (adminAction.value === 'volunteer') prefix = '/api/admin/volunteer'; else prefix = '/api/admin/media'; const data = await fetchApi(prefix + '?page=' + adminPage.value + '&size=20'); adminList.value = data.records || []; adminTotalPages.value = data.total ? Math.ceil(data.total / data.size) : 1; } catch(e) { if (e.message === '未登录') logout(); } }

        function switchPanel(key) { adminAction.value = key; adminPage.value = 1; loadAdminData(); }

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            return await fetchApi('/api/admin/activity/upload', { method: 'POST', body: formData });
        }

        async function uploadFiles(files) {
            uploading.value = true;
            try {
                for (const file of files) {
                    if (!file.type.startsWith('image/')) continue;
                    const url = await uploadFile(file);
                    uploadedImages.value.push(url);
                }
            } catch(e) { alert('上传失败: ' + e.message); }
            finally { uploading.value = false; }
        }

        async function handleDrop(e) { dragOver.value = false; await uploadFiles(e.dataTransfer.files); }
        async function handleFileSelect(e) { await uploadFiles(e.target.files); e.target.value = ''; }
        async function handleDropVolunteer(e) { dragOver2.value = false; await uploadFiles(e.dataTransfer.files); }
        async function handleVolunteerFileSelect(e) { await uploadFiles(e.target.files); e.target.value = ''; }
        async function handleDropMedia(e) { dragOver2.value = false; await uploadFiles(e.dataTransfer.files); }
        async function handleMediaFileSelect(e) { await uploadFiles(e.target.files); e.target.value = ''; }

        function removeUploadedImage(idx) { uploadedImages.value.splice(idx, 1); }

        function openEdit(item, type) {
            editingItem.value = item;
            editType.value = type || adminAction.value;
            uploadedImages.value = [];
            if (editType.value === 'activity') {
                resetEditForm();
                if (item) {
                    Object.assign(editForm, {
                        title: item.title || '', summary: item.summary || '', category: item.category || '课程活动',
                        communityName: item.communityName || '', location: item.location || '', activityDate: item.activityDate || '',
                        participantCount: item.participantCount || 0, volunteerCount: item.volunteerCount || 0,
                        content: item.content || '', coverUrl: item.coverUrl || ''
                    });
                    if (item.coverUrl) uploadedImages.value = [item.coverUrl];
                }
            } else if (editType.value === 'volunteer') {
                resetEditForm();
                if (item) {
                    Object.assign(editForm, {
                        name: item.name || '', type: item.type || 'PERSONAL', school: item.school || '',
                        memberCount: item.memberCount || 0, storyTitle: item.storyTitle || '', description: item.description || '',
                        serviceHours: item.serviceHours || 0, coverUrl: item.coverUrl || ''
                    });
                    if (item.coverUrl) uploadedImages.value = [item.coverUrl];
                }
            } else if (editType.value === 'media') {
                resetEditForm();
                if (item) {
                    Object.assign(editForm, { title: item.title || '', source: item.source || '', content: item.content || '' });
                    if (item.url) uploadedImages.value = [item.url];
                }
            }
            showEditModal.value = true;
        }

        function resetEditForm() {
            Object.assign(editForm, {
                title: '', summary: '', category: '课程活动', communityName: '', location: '', activityDate: '',
                participantCount: 0, volunteerCount: 0, content: '', coverUrl: '',
                name: '', type: 'PERSONAL', school: '', memberCount: 0, storyTitle: '', description: '', serviceHours: 0,
                source: ''
            });
        }

        async function saveItem() {
            try {
                let prefix, body, method, url;
                if (editType.value === 'activity') {
                    prefix = '/api/admin/activity';
                    body = {
                        title: editForm.title, summary: editForm.summary, category: editForm.category,
                        communityName: editForm.communityName, location: editForm.location,
                        activityDate: editForm.activityDate, participantCount: editForm.participantCount,
                        volunteerCount: editForm.volunteerCount, content: editForm.content,
                        coverUrl: uploadedImages.value[0] || editForm.coverUrl || '',
                        isPublished: 1
                    };
                } else if (editType.value === 'volunteer') {
                    prefix = '/api/admin/volunteer';
                    body = {
                        name: editForm.name, type: editForm.type, school: editForm.school,
                        memberCount: editForm.memberCount, storyTitle: editForm.storyTitle,
                        description: editForm.description, serviceHours: editForm.serviceHours,
                        coverUrl: uploadedImages.value[0] || editForm.coverUrl || '',
                        isPublished: 1
                    };
                } else {
                    prefix = '/api/admin/media';
                    body = {
                        title: editForm.title, source: editForm.source, content: editForm.content,
                        url: uploadedImages.value[0] || '', isPublished: 1
                    };
                }
                method = editingItem.value ? 'PUT' : 'POST';
                url = editingItem.value ? prefix + '/' + editingItem.value.id : prefix;
                await fetchApi(url, { method, body: JSON.stringify(body) });
                showEditModal.value = false;
                loadAdminData();
                loadStats();
            } catch(e) { alert(e.message); }
        }

        async function deleteItem(item) {
            if (!confirm('确定要删除该项吗？此操作不可恢复。')) return;
            try {
                let prefix;
                if (adminAction.value === 'activity') prefix = '/api/admin/activity';
                else if (adminAction.value === 'volunteer') prefix = '/api/admin/volunteer';
                else prefix = '/api/admin/media';
                await fetchApi(prefix + '/' + item.id, { method: 'DELETE' });
                adminList.value = adminList.value.filter(i => i.id !== item.id);
                loadStats();
            } catch(e) { alert(e.message); }
        }

        async function togglePublish(item) {
            try {
                let prefix;
                if (adminAction.value === 'activity') prefix = '/api/admin/activity';
                else if (adminAction.value === 'volunteer') prefix = '/api/admin/volunteer';
                else prefix = '/api/admin/media';
                const updated = { ...item, isPublished: item.isPublished === 1 ? 0 : 1 };
                await fetchApi(prefix + '/' + item.id, { method: 'PUT', body: JSON.stringify(updated) });
                item.isPublished = updated.isPublished;
            } catch(e) { alert(e.message); }
        }

        function viewDetail(a) { window.location.href = '/detail.html?type=activity&id=' + a.id; }
        function viewVolunteer(v) { window.location.href = '/detail.html?type=volunteer&id=' + v.id; }

        return {
            currentTab, token, loginErr, loading, loginForm, login, logout,
            pubCategories, adminCategories, activeTag,
            activities, volunteers, medias, communities, topics, recentActivities,
            overview, allTags, pubPage, pubTotalPages,
            adminAction, adminOptions, currentLabel,
            adminList, adminPage, adminTotalPages, loadAdminData, switchPanel,
            showEditModal, editingItem, editType, editTypeLabel, editForm,
            uploadedImages, uploading, dragOver, dragOver2,
